; Race timing box firmware
; Board: Seeed XIAO ESP32-S3
;
; Two build environments, one per box:
;   pio run -e start  -t upload     (start box A)
;   pio run -e finish -t upload     (finish box B)
; In VS Code: open the Timing System folder, then use the bottom bar or
; PlatformIO sidebar > Project Tasks > start or finish > Upload

[platformio]
src_dir = firmware/src
include_dir = firmware/include

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FW_VERSION=\"0.1.0\"

[env:start]
build_flags =
    ${env.build_flags}
    -D BOX_ROLE=\"start\"

[env:finish]
build_flags =
    ${env.build_flags}
    -D BOX_ROLE=\"finish\"
